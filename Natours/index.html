<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- Makes the page width match the device width and establishes the initial scale for responsive layouts. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Loads the Lato font and the font weights used throughout the site from Google Fonts. -->
        <link href="https://fonts.googleapis.com/css?family=Lato:100,300,400,700,900" rel="stylesheet">

        
        <link rel="stylesheet" href="css/icon-font.css">
        <link rel="stylesheet" href="css/style.css">
        
        <link rel="shortcut icon" type="image/png" href="img/favicon.png">
        
        <title>Natours | Exciting tours for adventurous people</title>
    </head>

    <body>
        <!-- Hero/header section containing the logo and primary page heading. -->
        <header class="header">

            <!-- Logo container is positioned independently within the header. -->
            <div class="logo-box">
                <img src="img/logo-white.png" alt="Logo">
            </div>

            <!-- Wraps the complete heading so the main and subheading can be positioned together. -->
            <div class="text-box">
                <h1 class="heading-primary">

                    <!-- Spans allow each part of the same h1 to be styled separately. -->
                    <span class="heading-primary-main">Outdoors</span>
                    <span class="heading-primary-sub">is where life happens</span>                
                </h1>
            </div>
        </header>
    </body>
</html>
