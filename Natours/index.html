<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <!-- Makes the page width match the device width and establishes the initial scale for responsive layouts. -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Loads the Lato font and the font weights used throughout the site from Google Fonts. -->
        <link href="https://fonts.googleapis.com/css?family=Lato:100,300,400,700,900" rel="stylesheet">
        
        <link rel="stylesheet" href="css/icon-font.css">
        <link rel="stylesheet" href="css/style.css">
        
        <link rel="shortcut icon" type="image/png" href="img/favicon.png">
        
        <title>Natours | Exciting tours for adventurous people</title>
    </head>
    <body>
        <!-- Hero/header section containing the logo and primary page heading. -->
        <!--
            BEM naming:
            block              = standalone component, e.g. header, heading-primary, btn
            block__element     = part of a block, e.g. header__logo-box
            block--modifier    = variation of a block, e.g. btn--white
        -->
        <header class="header">

            <!-- Logo container is positioned independently within the header. -->
            <div class="header__logo-box">
                <img src="img/logo-white.png" alt="Logo" class="header__logo">
            </div>

            <!-- Wraps and groups the heading text and button so they can be positioned and centered together. -->
            <div class="header__text-box">
                <h1 class="heading-primary">
                    <!-- Spans allow each part of the same h1 to be styled separately. -->
                    <span class="heading-primary--main">Outdoors</span>
                    <span class="heading-primary--sub">is where life happens</span>                
                </h1>
                <!-- This element uses two classes space-separated: btn for shared button styles and btn-white for white button styles. -->
                <!-- btn provides the base button styles; btn--white and btn--animated are BEM modifiers. -->
                <a href="#" class="btn btn--white btn--animated">Discover our tours</a>
            </div>
        </header>

        <section class="grid-test">
            
            <div class="row">
                <div class="col-1-of-2">
                    Col 1 of 2
                </div>
                <div class="col-1-of-2">
                    Col 1 of 2
                </div>
            </div>
            
            <div class="row">
                <div class="col-1-of-3">
                    Col 1 of 3
                </div>
                <div class="col-1-of-3">
                    Col 1 of 3
                </div>
                <div class="col-1-of-3">
                    Col 1 of 3
                </div>
            </div>

            <div class="row">
                <div class="col-1-of-3">
                    Col 1 of 3
                </div>
                <div class="col-2-of-3">
                    Col 2 of 3
                </div>
            </div>

            <div class="row">
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
            </div>

            <div class="row">
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
                <div class="col-2-of-4">
                    Col 2 of 4
                </div>
            </div>

            <div class="row">
                <div class="col-1-of-4">
                    Col 1 of 4
                </div>
                <div class="col-3-of-4">
                    Col 3 of 4
                </div>                
            </div>
                        
        </section>




    </body>
</html>
